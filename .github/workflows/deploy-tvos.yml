# Deploy tvOS (TestFlight)
#
# MARKETING_VERSION and CURRENT_PROJECT_VERSION come from root CMakeLists.txt
# (extract-version), injected at archive time.
#
# workflow_dispatch only until a successful manual TestFlight upload; do not
# wire into release-all.yml until then.
#
# Required secrets:
#   IOS_CERTIFICATE_P12_BASE64          - same Apple Distribution cert as iOS
#   IOS_CERTIFICATE_PASSWORD
#   TVOS_PROVISIONING_PROFILE_BASE64    - App Store tvOS profile for com.pylux.stream.tv
#   APP_STORE_CONNECT_API_KEY_KEY_ID
#   APP_STORE_CONNECT_API_KEY_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_KEY_BASE64

name: Deploy tvOS (TestFlight)

on:
  workflow_dispatch:

concurrency:
  group: deploy-tvos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tvos:
    name: Build and deploy tvOS to TestFlight
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version
        id: extract_version
        uses: ./.github/actions/extract-version

      - name: Install build dependencies
        run: |
          retry() {
            local attempts="$1"
            shift
            local n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                echo "Command failed after $n attempts: $*"
                return 1
              fi
              local sleep_s=$((n * 15))
              echo "Attempt $n failed; retrying in ${sleep_s}s: $*"
              sleep "$sleep_s"
              n=$((n + 1))
            done
          }
          retry 4 brew install cmake ninja protobuf@29 python-setuptools
          pip3 install --user --break-system-packages 'protobuf>=5,<6'
          echo "$(brew --prefix)/opt/protobuf@29/bin" >> "$GITHUB_PATH"

      - name: Download iOS/tvOS toolchain
        working-directory: tvos
        run: |
          if [ ! -f ios.toolchain.cmake ]; then
            curl -sL -o ios.toolchain.cmake \
              https://raw.githubusercontent.com/leetal/ios-cmake/master/ios.toolchain.cmake
          fi

      - name: Build chiaki-lib (Apple TV device)
        working-directory: tvos
        run: |
          cmake -S . -B build-appletvos -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake \
            -DPLATFORM=TVOS \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_LIBIDN2=OFF \
            -DCURL_USE_LIBPSL=OFF \
            -DUSE_NGHTTP2=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build-appletvos --config Release --target chiaki-lib

      - name: Create combined static library
        working-directory: tvos
        run: |
          find build-appletvos -name "*.a" -print0 | \
            xargs -0 libtool -static -o build-appletvos/libchiaki_complete.a

      - name: Import code signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::error::IOS_CERTIFICATE_P12_BASE64 secret is not set"
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/tvos-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 16)"
          echo "$P12_BASE64" > "$RUNNER_TEMP/cert.b64"
          base64 -D -i "$RUNNER_TEMP/cert.b64" -o "$CERT_PATH"
          rm -f "$RUNNER_TEMP/cert.b64"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.TVOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$PROFILE_BASE64" ]; then
            echo "::error::TVOS_PROVISIONING_PROFILE_BASE64 secret is not set"
            exit 1
          fi
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_BASE64" > "$RUNNER_TEMP/profile.b64"
          base64 -D -i "$RUNNER_TEMP/profile.b64" -o "$PROFILE_PATH"
          rm -f "$RUNNER_TEMP/profile.b64"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< \
            "$(security cms -D -i "$PROFILE_PATH" 2>/dev/null)")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_BASE64" ] || [ -z "$ASC_KEY_ID" ]; then
            echo "::error::App Store Connect API key secrets are not set"
            exit 1
          fi
          KEY_DIR="$RUNNER_TEMP/asc-keys"
          mkdir -p "$KEY_DIR"
          echo "$ASC_KEY_BASE64" > "$RUNNER_TEMP/key.b64"
          base64 -D -i "$RUNNER_TEMP/key.b64" -o "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          rm -f "$RUNNER_TEMP/key.b64"
          echo "APP_STORE_CONNECT_API_KEY_KEY_FILEPATH=$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Set tvOS marketing + build numbers from CMake
        run: |
          echo "TVOS_MARKETING_VERSION=${{ steps.extract_version.outputs.version }}" >> "$GITHUB_ENV"
          echo "TVOS_CURRENT_PROJECT_VERSION=${{ steps.extract_version.outputs.semver_build_id }}" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: tvos
        run: |
          xcodebuild -project PyluxTV.xcodeproj \
            -scheme PyluxTV \
            -sdk appletvos \
            -configuration Release \
            archive \
            -destination 'generic/platform=tvOS' \
            -archivePath build-derived/PyluxTV.xcarchive \
            -derivedDataPath build-derived \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=KG7LUU8FX7 \
            PROVISIONING_PROFILE=${{ env.PROVISIONING_PROFILE_UUID }} \
            MARKETING_VERSION="${TVOS_MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${TVOS_CURRENT_PROJECT_VERSION}"

      - name: Export IPA
        working-directory: tvos
        run: |
          cat > build-derived/CIExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>KG7LUU8FX7</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.pylux.stream.tv</key>
              <string>${{ env.PROVISIONING_PROFILE_UUID }}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build-derived/PyluxTV.xcarchive \
            -exportPath build-derived/export \
            -exportOptionsPlist build-derived/CIExportOptions.plist

          IPA=$(find "$PWD/build-derived/export" -maxdepth 1 -name "*.ipa" | head -1)
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "::error::Export failed — no .ipa found"
            exit 1
          fi
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        id: upload_testflight
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          PYLUX_SUBMIT_FOR_REVIEW: "false"
          PYLUX_TESTFLIGHT_EXTERNAL_BETA: "false"
        run: |
          retry() {
            local attempts="$1"
            shift
            local n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                echo "Command failed after $n attempts: $*"
                return 1
              fi
              local sleep_s=$((n * 15))
              echo "Attempt $n failed; retrying in ${sleep_s}s: $*"
              sleep "$sleep_s"
              n=$((n + 1))
            done
          }
          retry 4 brew install fastlane
          export PYLUX_IPA_PATH="${{ env.IPA_PATH }}"
          fastlane tvos upload_pylux_ipa

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/tvos-signing.keychain-db" 2>/dev/null || true
